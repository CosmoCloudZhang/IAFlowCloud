[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iaflowcloud"
version = "0.1.0"
description = "Intrinsic-alignment spectra and learned compression workflows"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "Code"}

[tool.setuptools.packages.find]
where = ["Code"]

[tool.ruff]
target-version = "py312"
src = ["Code"]
extend-exclude = ["Reference"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "N999"]
