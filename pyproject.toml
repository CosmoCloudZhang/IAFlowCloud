[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iaflowcloud"
version = "0.1.0"
description = "Intrinsic-alignment spectra and learned compression workflows"
requires-python = ">=3.12"

[project.scripts]
iaflow-prepare-data = "iaflow.commands.prepare_data:main"
iaflow-train-autoencoder = "iaflow.commands.train_autoencoder:main"
iaflow-evaluate-autoencoder = "iaflow.commands.evaluate_autoencoder:main"
iaflow-export-latents = "iaflow.commands.export_latents:main"

[tool.setuptools]
package-dir = {"" = "Code"}

[tool.setuptools.packages.find]
where = ["Code"]

[tool.ruff]
target-version = "py312"
src = ["Code"]
extend-exclude = ["Reference"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "N999"]
