# Depth04 Conv1D capacity tier: four convolutional layers and dense widths 512-256-64-16.

data: Config/NLA/Surface/Standard.yaml

model:
  name: Conv1D
  encoder_channels: [64, 128, 256, 512]
  kernel_sizes: [5, 5, 3, 3]
  strides: [2, 2, 2, 2]
  dense_hidden: [512, 256, 64, 16]
  activation: silu
  normalization: none
  group_count: 8
  dropout: 0.0

training: Config/NLA/Training/Standard.yaml

output:
  root_directory: Runs/NLA/AE/Conv1D/Depth04
  save_every_epochs: 50
