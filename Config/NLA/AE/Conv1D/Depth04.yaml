# Four-layer Conv1D surface autoencoder with materially increased capacity.

data: Config/NLA/Data/Surface.yaml

model:
  name: Conv1D
  encoder_channels: [64, 128, 256, 512]
  kernel_sizes: [5, 5, 3, 3]
  strides: [2, 2, 2, 2]
  dense_hidden: [256, 64]
  activation: silu
  normalization: none
  group_count: 8
  dropout: 0.0

training: Config/NLA/Training/Standard.yaml

output:
  root_directory: Runs/NLA/AE/Conv1D/Depth04
  save_every_epochs: 50
