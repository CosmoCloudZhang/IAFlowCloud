# Depth04 Conv2D capacity tier: four convolutional layers and dense widths 512-256-64-16.

data: Config/NLA/Surface/Standard.yaml

model:
  name: Conv2D
  encoder_channels: [32, 64, 128, 256]
  kernel_sizes: [[3, 5], [3, 5], [3, 3], [3, 3]]
  strides: [[1, 2], [2, 2], [2, 2], [1, 2]]
  dense_hidden: [512, 256, 64, 16]
  activation: silu
  normalization: none
  group_count: 8
  dropout: 0.0

training: Config/NLA/Training/Standard.yaml

output:
  root_directory: Runs/NLA/AE/Conv2D/Depth04
  save_every_epochs: 50
