# Conv1D compressor with a six-dimensional latent representation.
# Relative paths are resolved from the repository root.

data:
  source_path: Data/NLA/Samples/NLA.hdf5
  target_dataset: components/A_theta
  cache_directory: Data/NLA/Cache/Log10ATheta
  input_shape: [31, 101]
  transform: log10
  normalization: global_rms
  preparation_block_size: 3125
  batch_size: 512
  evaluation_batch_size: 512
  num_workers: 0

model:
  name: Conv1D
  latent_dim: 6
  encoder_channels: [64, 128, 256]
  kernel_sizes: [5, 5, 3]
  strides: [2, 2, 2]
  dense_hidden: [256, 64]
  activation: silu
  normalization: none
  group_count: 8
  dropout: 0.0

training:
  epochs: 500
  seed: 42
  device: auto
  deterministic: false
  loss: mse
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.00001
  gradient_clip_norm: 1.0
  mixed_precision: true
  scheduler: plateau
  scheduler_factor: 0.5
  scheduler_patience: 12
  minimum_learning_rate: 0.0000001
  early_stopping_patience: 35
  minimum_improvement: 0.0000001
  target_variance_recovered: 0.999

output:
  root_directory: Runs/NLA/AutoEncoder/Conv1D/Latent06
  run_name: null
  save_every_epochs: 25
